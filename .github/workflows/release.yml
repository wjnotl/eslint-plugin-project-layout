name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    name: Stage & Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for npm Trusted Publishing & Provenance attestation

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Code quality checks & tests
        run: |
          npm run typecheck
          npm test

      - name: Build package
        run: npm run build

      - name: Stage package to npm
        run: npm stage publish --access public --provenance
        # Staged publishing: uploads to npm staging queue.
        # Approve manually on npmjs.com or via 'npm stage approve'.

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
